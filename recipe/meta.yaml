{% set name = "gettsim" %}
{% set version = "1.4.0" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: "{{ version }}"

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/gettsim-{{ version }}.tar.gz
  sha256: 038d98852e0c16c6ee3b93a7d9b492a1af4d51a3b9c4ab30d724cc20c1c8a53d

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >={{ python_min }}
    - ttsim-backend >=1.2

test:
  imports:
    - gettsim
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  summary: The German Taxes and Transfers SIMulator
  license: AGPL-3.0-only
  license_file: LICENSE
  home: https://github.com/ttsim-dev/gettsim

extra:
  recipe-maintainers:
    - hmgaudecker
    - MImmesberger
